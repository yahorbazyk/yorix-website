name: Content Unicode hygiene

on:
  push:
    branches: [main, premium-web-payments]
    paths:
      - 'app/**'
      - 'content/**'
      - 'content-unicode.config.json'
      - 'tools/watermarks-remover/**'
      - 'scripts/prepare-english-articles.py'
      - 'scripts/test_english_articles.py'
      - 'scripts/content_unicode.py'
      - 'scripts/test_content_unicode.py'
      - '.github/workflows/content-unicode.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'content/**'
      - 'content-unicode.config.json'
      - 'tools/watermarks-remover/**'
      - 'scripts/prepare-english-articles.py'
      - 'scripts/test_english_articles.py'
      - 'scripts/content_unicode.py'
      - 'scripts/test_content_unicode.py'
      - '.github/workflows/content-unicode.yml'

permissions:
  contents: read

concurrency:
  group: content-unicode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-unicode:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test the conservative cleanup profile
        run: python3 -B -m unittest discover -s scripts -p test_content_unicode.py
      - name: Check article and localization sources without changing them
        run: python3 -B scripts/content_unicode.py check
      - name: Verify approved English package and route manifest
        run: python3 -B -m unittest discover -s scripts -p test_english_articles.py
